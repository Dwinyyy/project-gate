name: Foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hunter_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/hunter_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/hunter_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm format:check
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - id: e2e
        run: pnpm test:e2e
      - name: Upload synthetic profile screenshots
        if: steps.e2e.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task26-profile-disclosure-synthetic-pngs
          retention-days: 1
          if-no-files-found: error
          path: |
            .cache/task26-system-id-settings-390x844.png
            .cache/task5-r1-header-body-320x568.png
            .cache/task5-r1-header-no-body-320x568.png
            .cache/task26-system-id-card-320x568.png
            .cache/task26-system-id-card-390x844.png
            .cache/task26-system-id-card-440x900.png
            .cache/task26-system-id-card-640x390.png
            .cache/task5-r1-card-320x568.png
            .cache/task5-r1-card-640x390.png
            .cache/task5-r1-settings-feedback-390x844.png
